<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="R&eacute;visions">
<meta name="theme-color" content="#E3E5EA">
<link rel="apple-touch-icon" href="icon.png">
<title>R&eacute;visions</title>
<style>
  :root{
    --paper:#E3E5EA;
    --ink:#1E2333;
    --muted:#6B7285;
    --white:#FFFDFA;
    --star:#FFC531;
    --line:2.5px solid var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);}
  body{
    font-family:"Avenir Next","Avenir",system-ui,-apple-system,sans-serif;color:var(--ink);
    padding:max(14px,env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .display{font-family:"Futura","Avenir Next Demi Bold","Avenir Next",system-ui,sans-serif;}
  a{text-decoration:none;color:inherit;}

  h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:10px 2px 4px;line-height:1;}
  .sub{margin:0 2px 20px;font-size:13.5px;color:var(--muted);}

  .apps{display:grid;gap:13px;}
  @media (min-width:640px){ .apps{grid-template-columns:1fr 1fr;} }

  .app{
    display:flex;align-items:center;gap:14px;
    background:var(--white);border:var(--line);border-radius:22px;
    box-shadow:6px 6px 0 var(--accent);padding:18px 16px;
    transition:transform .07s ease, box-shadow .07s ease;
  }
  .app:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--accent);}
  .glyph{
    flex:none;width:58px;height:58px;border-radius:17px;background:var(--accent);color:#fff;
    border:var(--line);display:grid;place-items:center;font-size:26px;font-weight:700;
  }
  .txt{flex:1;min-width:0;}
  .kicker{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);margin-bottom:3px;}
  .name{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15;}
  .desc{display:block;font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.35;}
  .stat{display:inline-block;margin-top:9px;background:var(--star);border:2px solid var(--ink);
    border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;}
  .chev{flex:none;font-size:22px;color:var(--muted);}

  [hidden]{display:none !important;}
  footer{margin:26px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>

<h1 class="display">R&eacute;visions</h1>
<p class="sub">Choisis ce que tu veux travailler.</p>

<div class="apps">

  <a class="app" href="allemand/" style="--accent:#3457D5;">
    <span class="glyph display">A</span>
    <span class="txt">
      <span class="kicker">Allemand</span>
      <span class="name">Bo&icirc;te &agrave; mots</span>
      <span class="desc">Cartes et dict&eacute;e de vocabulaire</span>
      <span class="stat" id="statDe" hidden></span>
    </span>
    <span class="chev">&#8250;</span>
  </a>

  <a class="app" href="livrets/" style="--accent:#C92E76;">
    <span class="glyph display">&times;</span>
    <span class="txt">
      <span class="kicker">Math&eacute;matiques</span>
      <span class="name">Les livrets</span>
      <span class="desc">Entra&icirc;nement et test de 3 minutes</span>
      <span class="stat" id="statMa" hidden></span>
    </span>
    <span class="chev">&#8250;</span>
  </a>

  <a class="app" href="francais/" style="--accent:#6D3FD1;">
    <span class="glyph display">&para;</span>
    <span class="txt">
      <span class="kicker">Fran&ccedil;ais</span>
      <span class="name">Les phrases</span>
      <span class="desc">Types et formes de phrases</span>
      <span class="stat" id="statFr" hidden></span>
    </span>
    <span class="chev">&#8250;</span>
  </a>

</div>

<footer>Tout fonctionne sans connexion une fois la page ouverte.</footer>

<script>
"use strict";
/* Les trois applications partagent la même adresse, donc la même mémoire locale :
   on peut lire ici ce qui a déjà été fait. */
function show(id, texte){
  const el = document.getElementById(id);
  if (!texte) return;
  el.textContent = texte;
  el.hidden = false;
}
try {
  /* allemand : nombre de phrases écrites correctement, toutes leçons confondues */
  let mots = 0;
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.indexOf("wortkiste:") === 0){
      try { mots += JSON.parse(localStorage.getItem(k)).length; } catch(e){}
    }
  }
  if (mots) show("statDe", "\u2605 " + mots + (mots > 1 ? " phrases apprises" : " phrase apprise"));

  /* maths : meilleur résultat au test */
  const record = Number(localStorage.getItem("livrets:record") || 0);
  if (record) show("statMa", "Meilleur test\u202f: " + record + "/30");
} catch(e){ /* stockage bloqué : on n'affiche simplement rien */ }
</script>
</body>
</html>
